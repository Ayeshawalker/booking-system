<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Therapy agreement | Ayesha Jane</title>
    <link rel="stylesheet" href="styles.css?v=20260825-warmer-agreements" />
  </head>
  <body class="agreement-signing-page">
    <main class="agreement-signing-shell">
      <header class="agreement-signing-brand">
        <img src="assets/aj-logo-medium-preview.png" alt="Ayesha Jane Therapy, Counselling and Coaching" />
        <div><p class="admin-kicker">Private client document</p><h1>Therapy agreement</h1></div>
      </header>
      <section id="agreement-loading" class="agreement-public-state">Opening your secure agreement…</section>
      <section id="agreement-error" class="agreement-public-state agreement-public-error" hidden></section>
      <article id="agreement-document" class="agreement-public-document" hidden>
        <div id="agreement-copy" class="agreement-copy"></div>
        <section class="agreement-signature-panel">
          <h2>Electronic signature</h2>
          <p id="agreement-signing-intro"></p>
          <div id="agreement-signer-status" class="agreement-signer-status"></div>
          <form id="agreement-sign-form">
            <label id="agreement-signer-choice" hidden>Who is signing?
              <select name="signer"><option value="1">First person</option><option value="2">Second person</option></select>
            </label>
            <label>Full name<input name="name" autocomplete="name" required /></label>
            <fieldset>
              <legend>Please tick one communication preference</legend>
              <label class="agreement-choice"><input type="radio" name="communicationChoice" value="whatsapp" required /> I am happy for invoices, appointments and documents to be shared with me via WhatsApp.</label>
              <label class="agreement-choice"><input type="radio" name="communicationChoice" value="alternative" /> I would prefer another method.</label>
              <label id="agreement-alternative-wrap" hidden>Preferred alternative<input name="contactAlternative" placeholder="For example, email" /></label>
            </fieldset>
            <label id="agreement-fees-policy-accept" class="agreement-choice agreement-accept"><input type="checkbox" name="feesAndCancellationAccepted" required /> I understand my personalised session fees, when payment is due, and the 48-hour cancellation and rescheduling policy.</label>
            <label class="agreement-choice agreement-accept"><input type="checkbox" name="accepted" required /> I have read and understood this agreement and agree to its terms.</label>
            <button type="submit">Sign agreement</button>
            <p id="agreement-form-message" class="admin-message" role="status"></p>
          </form>
        </section>
      </article>
      <p class="agreement-privacy-link"><a href="privacy-notice.html" target="_blank" rel="noopener">Read the Privacy Notice</a></p>
    </main>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="sign-agreement.js?v=20260825-warmer-agreements"></script>
  </body>
</html>
