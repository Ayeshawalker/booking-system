<head>
  <meta charset="utf-8" />

<body class="supervision-page">
  <header class="site-header no-print">
    <a class="brand" href="https://ayeshajane.com/">Ayesha Jane</a>
    <nav class="admin-nav" aria-label="Private admin links">
      <a href="clients.html">Clients</a><a href="calendar.html">Calendar</a><a href="payments.html">Payments</a>

    </nav>
  </header>
  <main class="settings-shell">
    <section class="booking-panel supervision-sheet" aria-labelledby="supervision-title">
      <div class="intro">
        <p class="eyebrow">Private clinical preparation</p>
        <h1 id="supervision-title">Supervision</h1>
        <p>Outstanding questions gathered from client notes. Use only the minimum identifying information needed in supervision.</p>
      </div>
      <div class="supervision-toolbar no-print">
        <label>Show<select id="supervision-filter"><option value="outstanding">To discuss</option><option value="discussed">Discussed</option><option value="all">All items</option></select></label>
        <button id="print-supervision" type="button">Print or save as PDF</button>
      </div>
      <p id="supervision-message" class="note-save-message" aria-live="polite"></p>
      <div id="supervision-list" class="supervision-list"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
