<!doctype html>
<html lang="en" class="admin-auth-checking">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ayesha Jane Agreement Preview</title>
    <link rel="stylesheet" href="styles.css?v=20260810-agreement-feedback" />

  <body class="agreement-preview-page">
    <header class="site-header">
      <a class="brand agreement-brand" href="clients.html">
        <img src="assets/aj-logo-medium-preview.png" alt="Ayesha Jane Therapy, Counselling and Coaching" />

      <nav class="admin-nav" aria-label="Private admin links">
